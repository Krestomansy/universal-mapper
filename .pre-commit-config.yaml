repos:
-   repo: local
    hooks:
    -   id: ruff
        name: ruff
        entry: .venv/bin/ruff check
        language: python
        types: [python]
        pass_filenames: false
    -   id: mypy
        name: mypy
        entry: .venv/bin/mypy .
        language: python
        types: [python]
        pass_filenames: false